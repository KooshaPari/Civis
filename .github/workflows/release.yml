name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      crate:
        description: 'Specific crate to publish (empty = all publishable)'
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${{ inputs.crate }}" ]; then
            cargo publish -p "${{ inputs.crate }}" --no-verify
          else
            for name in $(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name'); do
              echo "Publishing $name"
              cargo publish -p "$name" --no-verify || echo "  skip $name (likely path-dep or already published)"
            done
          fi

  desktop-windows:
    name: Build Bevy desktop client for release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: true
      - name: Build Bevy client (release)
        run: cargo build --release -p civ-bevy-ref --bin civ-bevy-ref --features bevy,egui
      - name: Package executable + assets
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -Path target/release/civ-bevy-ref.exe -Destination artifact/civ-bevy-ref.exe
          Copy-Item -Path clients/bevy-ref/assets -Destination artifact/assets -Recurse
      - name: Create release archive
        run: |
          cd artifact
          Compress-Archive -Path civ-bevy-ref.exe, assets -DestinationPath ../civis-windows.zip
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" civis-windows.zip

  check-cliff-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cliff.toml adoption
        run: ./scripts/check-cliff-template.sh
