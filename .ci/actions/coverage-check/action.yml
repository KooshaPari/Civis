name: 'Coverage Check'
description: 'Runs cargo tarpaulin (or llvm-cov) to check line coverage meets threshold.'
inputs:
  package:
    description: 'Package to check.'
    required: true
  threshold:
    description: 'Minimum line-coverage percentage (integer).'
    required: false
    default: '75'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        echo "Checking coverage for ${{ inputs.package }} (threshold ${{ inputs.threshold }}%)"
        # Prefer cargo-tarpaulin; use cargo-llvm-cov when tarpaulin is absent.
        if command -v cargo-tarpaulin &>/dev/null; then
          cargo tarpaulin -p "${{ inputs.package }}" --out Xml --threshold ${{ inputs.threshold }}
        elif command -v cargo-llvm-cov &>/dev/null; then
          cargo llvm-cov -p "${{ inputs.package }}" --all-features --summary-only --fail-under-lines "${{ inputs.threshold }}"
        else
          echo "No supported coverage tool found (cargo-tarpaulin or cargo-llvm-cov)" >&2
          exit 1
        fi
