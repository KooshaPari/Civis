[package]
name = "civ-ai"
description = "Generic AiProvider port + blake3 cache + AiEvent provenance + async worker pool (generalizes civ-research)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
# Dynamic ORT keeps model/runtime downloads out of builds; set ORT_DYLIB_PATH
# to the approved native runtime before enabling the provider at runtime.
fastembed = { version = "5.17.3", optional = true, default-features = false, features = ["ort-load-dynamic"] }
# Cloud / dev HTTP providers (feature-gated): reuses civ-research's FirepassKimiClient.
civ-research = { path = "../research", optional = true, features = ["firepass-kimi"] }
mistralrs = { version = "0.8.1", optional = true, default-features = false }

[features]
default = []
# Cloud heavy-reasoning fallback: wraps civ-research::FirepassKimiClient. Opt-in.
cloud = ["dep:civ-research"]
# Local in-process SLM (mistral.rs GGUF), loaded only from caller-owned files.
local = ["dep:mistralrs"]
# Embedding provider (fastembed-rs / ort, MiniLM). Requires a local ORT
# runtime and a user-supplied model directory; no model download is performed.
embed = ["dep:fastembed"]
# Dev-only Ollama provider (OpenAI-compatible HTTP).
dev = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
