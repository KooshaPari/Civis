# Run the shared security guard on every change; local hooks remain supplemental.
name: Security Guard

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    manifest-verify:
        name: manifest-verify (cloud)
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - name: Verify local quality manifest
              run: bash scripts/quality/verify-quality-manifest.sh
              continue-on-error: true

    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - name: Run pre-commit guard checks
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: --hook-stage pre-commit --config .pre-commit-config.yaml --show-diff-on-failure
