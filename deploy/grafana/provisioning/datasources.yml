apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: "15s"
          httpMethod: POST

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:4317
      editable: false
      jsonData:
          tracesToLogs:
              datasourceUid: loki
              filterByTraceID: true
          serviceMap:
              datasourceUid: prometheus
          nodeGraph:
              enabled: true
          lokiSearch:
              datasourceUid: loki
