name: Nightly Build

on:
  schedule:
    # 07:23 UTC = 11:23 PM PST (minimal CI contention)
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-desktop:
    name: Nightly Bevy desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: true
      - name: Build Bevy client (release)
        run: cargo build --release -p civ-bevy-ref --bin civ-bevy-window --features bevy,egui
      - name: Package executable + assets
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -Path target/release/civ-bevy-window.exe -Destination artifact/civ-bevy-window.exe
          Copy-Item -Path clients/bevy-ref/assets -Destination artifact/assets -Recurse
      - name: Create release archive
        run: |
          cd artifact
          Compress-Archive -Path civ-bevy-window.exe, assets -DestinationPath ../civis-windows-nightly.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: civis-windows-nightly
          path: civis-windows-nightly.zip
          retention-days: 7
