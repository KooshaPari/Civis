<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Civis emblem">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0f1518"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9e0da"/>
      <stop offset="55%" stop-color="#7ebab5"/>
      <stop offset="100%" stop-color="#4f8781"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- glass disc backdrop -->
  <circle cx="200" cy="200" r="180" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#7ebab5" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#7ebab5" stroke-opacity="0.10" stroke-width="1"/>

  <!-- emergence-network glow halo -->
  <g opacity="0.35" filter="url(#softglow)" fill="#7ebab5">
    <circle cx="200" cy="120" r="6"/><circle cx="120" cy="250" r="6"/><circle cx="280" cy="250" r="6"/>
    <circle cx="200" cy="300" r="5"/>
  </g>

  <!-- world-tree / phoenix emergence lattice -->
  <g filter="url(#glow)" fill="none" stroke="url(#teal)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- central trunk column of hex nodes -->
    <polyline points="200,300 200,205 200,120"/>
    <!-- ascending branch pair (phoenix wings) -->
    <polyline points="200,205 148,150 120,96"/>
    <polyline points="200,205 252,150 280,96"/>
    <polyline points="200,160 158,120"/>
    <polyline points="200,160 242,120"/>
    <!-- root/base spread -->
    <polyline points="200,300 138,262 108,300"/>
    <polyline points="200,300 262,262 292,300"/>
    <!-- canopy connective arc -->
    <path d="M120,96 Q200,60 280,96"/>
  </g>

  <!-- hex nodes at vertices -->
  <g fill="#090a0c" stroke="url(#teal)" stroke-width="2.6" filter="url(#glow)">
    <!-- helper hexagons drawn as small rotated polygons -->
    <polygon points="200,104 214,112 214,128 200,136 186,128 186,112"/>
    <polygon points="200,190 213,197 213,213 200,220 187,213 187,197"/>
    <polygon points="120,82 132,89 132,103 120,110 108,103 108,89"/>
    <polygon points="280,82 292,89 292,103 280,110 268,103 268,89"/>
    <polygon points="108,290 120,297 120,311 108,318 96,311 96,297"/>
    <polygon points="292,290 304,297 304,311 292,318 280,311 280,297"/>
  </g>

  <!-- luminous core -->
  <circle cx="200" cy="205" r="7" fill="#d7f2ee"/>
  <circle cx="200" cy="205" r="14" fill="none" stroke="#a9e0da" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
