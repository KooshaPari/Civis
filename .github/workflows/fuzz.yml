name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration (e.g., 60s, 5m, 1h)'
        required: false
        default: '60s'

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ github.event.inputs.duration || '60s' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_replay
          - fuzz_wasm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ hashFiles('crates/**') }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target
        run: |
          cargo fuzz run ${{ matrix.target }} --
            -max_total_time=${{ env.FUZZ_DURATION }}
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
