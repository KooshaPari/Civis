[package]
name = "asset-pipeline"
version = "0.1.0"
edition = "2021"
authors = ["CivLab"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "Civis asset export pipeline — SVG → PNG@1x/2x/3x + ICO + (WEBM, FR-ASSET-PIPELINE-002)"
publish = false

[features]
default = []
cli = ["dep:clap"]

[dependencies]
# SVG → PNG rasterization
resvg = "0.43"
# PNG → ICO encoding (ICO-only feature set keeps dep surface minimal)
image = { version = "0.25", default-features = false, features = ["ico"] }
# CLI (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "svg_export"
required-features = ["cli"]
