[package]
name = "civ-hud"
description = "HUD dashboard panels and overlays for Civis — pure data types for population, economy, diplomacy, technology, and society indicators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "civ_hud"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.11"
