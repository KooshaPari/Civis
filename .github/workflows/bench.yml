name: Benchmarks
on:
    push:
        branches: [main]
    pull_request:
jobs:
    bench:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
            - name: Run criterion benchmarks (workspace)
              run: cargo bench --workspace -- --test 2>&1 | tail -80
              # --test runs the benchmark binary but exits immediately after
              # gathering timing data, preventing regressions from slipping
              # through.  The pipe to tail keeps CI logs readable.
            - name: Verify benchmark binaries compile
              run: cargo bench --workspace --no-run 2>&1
