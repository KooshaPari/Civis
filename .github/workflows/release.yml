name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      crate:
        description: 'Specific crate to publish (empty = all publishable)'
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run locked workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Run strict workspace clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Dry-run publishable crates
        run: |
          if [ -n "${{ inputs.crate }}" ]; then
            cargo publish -p "${{ inputs.crate }}" --locked --dry-run
          else
            for name in $(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name'); do
              echo "Dry-running $name"
              cargo publish -p "$name" --locked --dry-run
            done
          fi

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${{ inputs.crate }}" ]; then
            cargo publish -p "${{ inputs.crate }}" --locked
          else
            for name in $(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name'); do
              echo "Publishing $name"
              cargo publish -p "$name" --locked
            done
          fi

  check-cliff-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cliff.toml adoption
        run: ./scripts/check-cliff-template.sh
