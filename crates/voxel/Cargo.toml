[package]
name = "civ-voxel"
description = "Adaptive voxel substrate: sparse octree + dense leaf chunks; deterministic mesh-dirty queue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Compact, deterministic binary serialisation for the disk-backed dirty-chunk cache.
bincode = "1.3"

# Adaptive voxel kernel shared across Phenotype-org game clients.
#
# Vendor as a workspace path dependency: the upstream remote
# (https://github.com/KooshaPari/phenotype-gfx.git @ 7ed27211554f5ba25d3a79c54c73262db6e160b1)
# now returns "Repository not found", which made `cargo metadata` fail on every
# clean checkout and reddened the whole CI surface. The exact revision that was
# pinned is checked in under vendor/phenotype-gfx/ so builds no longer depend on
# network access to a private/gone remote.
# Provenance: vendor/phenotype-gfx/PROVENANCE.md
phenotype-voxel = { path = "../../vendor/phenotype-gfx/crates/phenotype-voxel", package = "phenotype-voxel" }

[dev-dependencies]
criterion = { version = "=0.5.1", features = ["html_reports"] }
proptest = "1.11"
# Used by the PBR substrate unit tests to round-trip attestation manifests.
serde_json = "1"
# Used by the PBR / HUD substrate unit tests to round-trip plans and
# panel state through RON (the laws + civ-traffic crates already standardise
# on RON for replay/save formats).
ron = "0.12"

[[bench]]
name = "ca_dirty_chunk"
harness = false

[[bench]]
name = "pbr_greedy_atlas"
harness = false
