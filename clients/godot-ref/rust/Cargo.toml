[package]
name = "civis-godot-rust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
# `rlib` is required so the integration tests under `tests/` can link the
# crate; `cdylib` remains the shipped GDExtension artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
civ-engine = { path = "../../../crates/engine" }
civ-protocol-3d = { path = "../../../crates/protocol-3d" }
civ-voxel = { path = "../../../crates/voxel" }
godot = { version = "0.4", default-features = false, features = ["lazy-function-tables"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
