name: Playthrough RPC tests

on:
    push:
        branches: [main]
        paths:
            - "scripts/playthrough.sh"
            - "scripts/tests/test_playthrough_rpc*.py"
            - ".github/workflows/playthrough-rpc-tests.yml"
    pull_request:
        paths:
            - "scripts/playthrough.sh"
            - "scripts/tests/test_playthrough_rpc*.py"
            - ".github/workflows/playthrough-rpc-tests.yml"

permissions:
    contents: read

jobs:
    parser-regressions:
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - name: Check Bash syntax
              run: bash -n scripts/playthrough.sh
            - name: Fetch pinned websocat for wire regressions
              run: |
                  curl --fail --silent --show-error --location --max-time 60 \
                    https://github.com/vi/websocat/releases/download/v1.13.0/websocat.x86_64-unknown-linux-musl \
                    --output "$RUNNER_TEMP/websocat"
                  printf '%s  %s\n' \
                    8f84c57103d33ab73888707041765e0e7e6a43a91fbb6e1828cd5eabc19ae32c \
                    "$RUNNER_TEMP/websocat" | sha256sum --check
                  chmod +x "$RUNNER_TEMP/websocat"
            - name: Run mocked and real wire parser regressions
              run: python3 -m unittest discover -s scripts/tests -p 'test_playthrough_rpc*.py' -v
              env:
                  WEBSOCAT_BIN: ${{ runner.temp }}/websocat
