name: Mutation
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
jobs:
    mutants:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
            - name: Install cargo-mutants
              run: cargo install cargo-mutants --locked
            - name: Run cargo-mutants (pre-checked code)
              shell: bash
              run: |
                  # Read the recorded ratchet floor; default to the seeded crate baseline.
                  FLOOR=$(grep -oP '"floor"\s*:\s*\K[0-9.]+' .github/mutation_ratchet.json || true)
                  [ -z "$FLOOR" ] && FLOOR=70.0
                  set +e
                  # Ratchet scope: civ-save-db (self-contained, real baseline ~14s, measurable kill rate).
                  cargo mutants --no-shuffle -j 2 --timeout 300 -p civ-save-db 2>&1 | tee mutants.log
                  statuses=("${PIPESTATUS[@]}")
                  set -e
                  if [ "${statuses[1]}" -ne 0 ]; then
                    echo "::error::Could not retain mutation output; no kill rate is available"
                    exit "${statuses[1]}"
                  fi
                  case "${statuses[0]}" in
                    0|2) ;; # Complete results; missed mutants are evaluated against 95% below.
                    *) echo "::error::Mutation execution failed (exit ${statuses[0]}); no kill rate is available"
                       exit "${statuses[0]}" ;;
                  esac
                  # Extract kill rate from the summary line.
                  SUMMARY=$(sed 's/\x1b\[[0-9;]*m//g' mutants.log | grep -E '^[0-9]+ mutants? tested in ' | tail -1 || true)
                  TOTAL=$(printf '%s\n' "$SUMMARY" | awk '{print $1}')
                  if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [ "$TOTAL" -eq 0 ]; then
                    echo "::error::Mutation run produced no valid tested count; no kill rate is available"
                    exit 1
                  fi
                  KILLED=$(printf '%s\n' "$SUMMARY" | grep -oP '(\d+) caught' | grep -oP '\d+' || echo "0")
                  if ! [[ "$KILLED" =~ ^[0-9]+$ ]] || [ "$KILLED" -gt "$TOTAL" ]; then
                    echo "::error::Mutation summary has an invalid caught count; no kill rate is available"
                    exit 1
                  fi
                  RATE=$(echo "scale=1; $KILLED * 100 / $TOTAL" | bc)
                  echo "Kill rate: ${RATE}% (${KILLED}/${TOTAL})"
                  # Fail only if kill rate drops below the recorded ratchet floor (monotonic).
                  PASS=$(echo "$RATE >= $FLOOR" | bc)
                  if [ "$PASS" -ne 1 ]; then
                    echo "::error::Mutation kill rate ${RATE}% is below ratchet floor ${FLOOR}% — coverage regressed"
                    exit 1
                  fi
                  echo "Mutation kill rate ${RATE}% meets ratchet floor ${FLOOR}%"
                  echo "Ratchet scope: -p civ-save-db; floor=${FLOOR}%. Raise the floor in .github/mutation_ratchet.json to drive coverage up."
