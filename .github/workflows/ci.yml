name: CI

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master, develop]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  # ─── Rust Module Graph (cargo-modules graph per workspace package) ──
  module-graph:
    name: Rust Module Graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-modules
        run: cargo install cargo-modules --locked
      - name: Module graph (cargo-modules)
        shell: bash
        run: |
          # Build module graph for every workspace member and fail on error.
          failed=0
          while IFS= read -r pkg; do
            echo "--- $pkg ---"
            if ! cargo modules graph --package "$pkg" 2>&1 | head -5; then
              failed=1
            fi
          done < <(cargo metadata --no-deps --format-version 1 | python -c "
          import sys, json
          for p in json.load(sys.stdin)['packages']:
              print(p['name'])
          ")
          exit $failed