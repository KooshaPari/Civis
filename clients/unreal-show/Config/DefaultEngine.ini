[/Script/EngineSettings.GameMapsSettings]
; CivShow has no baked .umap — the world is built procedurally from the Civis
; sim server (HTTP terrain + WS snapshots). So we boot an empty level with the
; CivShow GameMode, which spawns AVoxelTerrain and connects to 127.0.0.1:9090.
GlobalDefaultGameMode=/Script/CivShow.CivShowGameMode
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry

[/Script/Engine.Engine]
; Use a deterministic fixed framerate base; the sim drives world state.
bUseFixedFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
