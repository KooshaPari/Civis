name: Save diplomacy regressions
on:
  pull_request:
    paths:
      - 'crates/engine/**'
      - 'crates/server/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/save-diplomacy-tests.yml'
  push:
    branches: [main]
    paths:
      - 'crates/engine/**'
      - 'crates/server/**'
      - '.github/workflows/save-diplomacy-tests.yml'
permissions:
  contents: read
jobs:
  save-diplomacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Check JSON and binary compatibility
        run: cargo test --locked -p civ-engine --lib relation_rows_tests -j2
      - name: Check seed42 tick0 archive regression
        run: cargo test --locked -p civ-engine --test save_diplomacy_json -j2
      - name: Check actual save.slot dispatch and archive
        run: cargo test --locked -p civ-server --lib jsonrpc_save_slot -j2
