name: DAG Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'plans/*.md'
      - 'crates/dag/**'

permissions:
  contents: read
  checks: write

concurrency:
  group: dag-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dag-gate:
    name: DAG §3 Verification Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            crates/dag -> target

      - name: Build civ-dag-gate
        working-directory: crates/dag
        run: cargo build -p civ-dag --bin civ-dag-gate

      - name: Run DAG §3 gate on master plan
        working-directory: ${{ github.workspace }}
        run: |
          PLAN="plans/2026-06-26-civis-master-dag-v1.md"
          if [ ! -f "$PLAN" ]; then
            echo "No plan file found at $PLAN — SKIPPING"
            exit 0
          fi
          echo "=== DAG §3 Gate: $PLAN ==="
          ./target/debug/civ-dag-gate "$PLAN" --format=json > gate-report.json || true
          cat gate-report.json | python3 -c "
import sys, json
data = json.load(sys.stdin)
outcome = data.get('outcome', 'unknown')
print(f'Gate outcome: {outcome}')
passed = sum(1 for r in data.get('results', []) if r.get('passed'))
failed = sum(1 for r in data.get('results', []) if not r.get('passed'))
skipped = sum(1 for r in data.get('results', []) if r.get('skipped'))
print(f'  {passed} passed, {failed} failed, {skipped} skipped')
if failed > 0:
    print('FAILED nodes:')
    for r in data.get('results', []):
        if not r.get('passed'):
            print(f'  - {r.get(\"node_id\", \"?\")}: {r.get(\"reason\", \"\")}')
if outcome == 'fail':
    exit(1)
"
