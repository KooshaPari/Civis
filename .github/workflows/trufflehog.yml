# Run secret scanning on every change; local hooks remain supplemental.
name: Trufflehog Secrets Scan
# Local hooks plus Security Guard cover automatic secret checks. Keep the
# heavyweight Trufflehog scan available as an explicit, free-runner escape
# hatch without creating a billed/duplicate check on every change.
on: workflow_dispatch

jobs:
  manifest-verify:
    name: manifest-verify (cloud)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify local quality manifest
        run: bash scripts/quality/verify-quality-manifest.sh

  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: trufflehog/actions/setup@main
      - run: trufflehog github --only-verified --no-update
