name: Playthrough RPC tests

on:
    push:
        branches: [main]
        paths:
            - "scripts/playthrough.sh"
            - "scripts/tests/test_playthrough_rpc.py"
            - ".github/workflows/playthrough-rpc-tests.yml"
    pull_request:
        paths:
            - "scripts/playthrough.sh"
            - "scripts/tests/test_playthrough_rpc.py"
            - ".github/workflows/playthrough-rpc-tests.yml"

permissions:
    contents: read

jobs:
    parser-regressions:
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - name: Check Bash syntax
              run: bash -n scripts/playthrough.sh
            - name: Run parser regressions with mocked transport
              run: python3 -m unittest discover -s scripts/tests -p 'test_playthrough_rpc.py' -v
