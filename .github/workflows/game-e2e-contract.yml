name: Game E2E Safety Contract

on:
    pull_request:
        paths:
            - "scripts/game-e2e.sh"
            - "scripts/test_game_e2e_contract.py"
            - ".github/workflows/game-e2e.yml"
            - ".github/workflows/game-e2e-contract.yml"

permissions:
    contents: read

jobs:
    safety-contract:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Run mock-only safety and syntax checks without skips
              run: |
                  bash --version
                  python3 - <<'PY'
                  import importlib.util
                  import unittest

                  spec = importlib.util.spec_from_file_location(
                      "game_e2e_contract", "scripts/test_game_e2e_contract.py"
                  )
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  suite = unittest.defaultTestLoader.loadTestsFromModule(module)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
                  PY
